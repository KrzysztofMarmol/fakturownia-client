[project]
name = "fakturownia-client"
dynamic = ["version"]
description = "Python client for the Fakturownia (InvoiceOcean) REST API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Krzysztof Marmol", email = "krzysztof.marmol@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fakturownia", "invoiceocean", "invoices", "api", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/KrzysztofMarmol/fakturownia-client"
Issues = "https://github.com/KrzysztofMarmol/fakturownia-client/issues"
Changelog = "https://github.com/KrzysztofMarmol/fakturownia-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "fakturownia_client._version.__version__" }

[tool.setuptools.package-data]
fakturownia_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests hitting the real Fakturownia API (require FAKTUROWNIA_DOMAIN and FAKTUROWNIA_API_TOKEN)",
]
